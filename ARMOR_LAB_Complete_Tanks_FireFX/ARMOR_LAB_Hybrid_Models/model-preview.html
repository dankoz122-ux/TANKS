<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARMOR LAB · просмотр моделей</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0e130f;color:#e7eee2;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}header{height:56px;display:flex;align-items:center;gap:12px;padding:8px 14px;background:#172019;border-bottom:1px solid #3b4b3b}header b{letter-spacing:.1em;font-size:12px}header label{font-size:11px;color:#afbea9}select{background:#253329;color:#edf3e8;border:1px solid #52694e;border-radius:6px;padding:7px 10px}small{color:#a5b4a0;font-size:10px}#stage{position:absolute;top:56px;bottom:0;left:0;right:0}#view{width:100%;height:100%;display:block}#labels{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}#labels span{padding:10px 12px;color:#d6dfd0;font-size:10px;text-shadow:0 1px 3px #000;letter-spacing:.1em}.error{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:#341c18;border:1px solid #9b5e50;padding:12px 16px;border-radius:8px;max-width:80%;font-size:12px}.sub{margin-left:auto;text-align:right}@media(max-width:650px){header{height:52px;padding:6px 8px}#stage{top:52px}header b{font-size:10px}.sub{display:none}}
</style>
</head>
<body>
<header><b>ARMOR LAB / MODEL REVIEW</b><label for="model">Модель</label><select id="model"><option value="abrams">M1A2 Abrams</option><option value="leopard">Leopard 2A7</option><option value="t90">Т-90М</option><option value="merkava">Merkava Mk.3</option></select><small class="sub">4 ракурса · изометрия / сбоку / сверху / спереди</small></header>
<div id="stage"><canvas id="view"></canvas><div id="labels"><span>ИЗОМЕТРИЯ</span><span>СБОКУ</span><span>СВЕРХУ</span><span>СПЕРЕДИ</span></div><div id="error" class="error"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {createTank as createT90} from './js/tanks/t90.js';
import {createTank as createAbrams} from './js/tanks/abrams.js';
import {createTank as createLeopard} from './js/tanks/leopard.js';
import {createTank as createMerkava} from './js/tanks/merkava.js';
const factories={t90:createT90,abrams:createAbrams,leopard:createLeopard,merkava:createMerkava};
const canvas=document.querySelector('#view'),error=document.querySelector('#error');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor('#1b211c',1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#1b211c');scene.add(new THREE.HemisphereLight(0xe8eee0,0x353d2e,2.3));const key=new THREE.DirectionalLight(0xfff0d2,3.1);key.position.set(-7,11,-8);key.castShadow=true;scene.add(key);const fill=new THREE.DirectionalLight(0xb9d6ca,1.0);fill.position.set(5,4,5);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#1b211c',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;ground.receiveShadow=true;scene.add(ground);
const camDefs=[
 {eye:[7,5.2,-8],up:[0,1,0]},
 {eye:[10,2.0,0],up:[0,1,0]},
 {eye:[0,12,0],up:[0,0,-1]},
 {eye:[0,2.2,-10],up:[0,1,0]}
];let cams=[];for(const d of camDefs){const c=new THREE.OrthographicCamera(-3.8,3.8,3.0,-3.0,.1,100);c.position.set(...d.eye);c.up.set(...d.up);c.lookAt(0,1.2,0);cams.push(c)}
let active=null;
function cleanup(){if(!active)return;scene.remove(active.root);active.root.traverse(o=>{if(o.isMesh){o.geometry?.dispose();if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material?.dispose()}});active=null}
function loadModel(id){try{cleanup();active=factories[id](THREE);active.root.position.set(0,0,0);scene.add(active.root);active.root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});error.style.display='none'}catch(e){error.textContent='Не удалось создать модель: '+(e?.stack||e);error.style.display='block';console.error(e)}}
document.querySelector('#model').addEventListener('change',e=>loadModel(e.target.value));
function resize(){renderer.setSize(document.querySelector('#stage').clientWidth,document.querySelector('#stage').clientHeight,false);render()}
function render(){const w=renderer.domElement.clientWidth,h=renderer.domElement.clientHeight;const cw=w/2,ch=h/2;renderer.setScissorTest(true);const rects=[{x:0,y:h-ch,w:cw,h:ch},{x:cw,y:h-ch,w:cw,h:ch},{x:0,y:0,w:cw,h:ch},{x:cw,y:0,w:cw,h:ch}];for(let i=0;i<4;i++){const r=rects[i],c=cams[i];renderer.setViewport(r.x,r.y,r.w,r.h);renderer.setScissor(r.x,r.y,r.w,r.h);renderer.clear(true,true,true);c.left=-3.8*(r.w/r.h);c.right=3.8*(r.w/r.h);c.top=3.0;c.bottom=-3.0;c.updateProjectionMatrix();renderer.render(scene,c)}renderer.setScissorTest(false)}
window.addEventListener('resize',resize);loadModel('abrams');resize();
</script>
</body>
</html>
